name: rindo
description: "Touring companion for Japan: JMA rain radar, road closures, and seasonal gates on a rider-centred map."
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_file_dialog: ^3.3.2
  flutter_map: ^8.3.1
  geolocator: ^14.0.3
  google_mlkit_translation: ^0.14.0
  http: ^1.6.0
  latlong2: ^0.10.1
  meta: ^1.18.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  xml: ^7.0.1

dev_dependencies:
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/app_icon.png
  adaptive_icon_background: "#22323d"
  adaptive_icon_foreground: assets/icon/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
