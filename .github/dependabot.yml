# Weekly dependency-update PRs. Security alerts/updates are configured in
# the repo's Code security settings, not here.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    # The Flutter SDK pins meta through flutter_test. A newer meta cannot
    # resolve until we move to a Flutter release that ships it.
    ignore:
      - dependency-name: meta
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
